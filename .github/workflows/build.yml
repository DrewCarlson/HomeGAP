name: Build and publish

# Tests on every push/PR; builds the multi-arch image everywhere and publishes it to GHCR
# for pushes to main (tags: main, sha-<short>) and version tags (vX.Y.Z -> X.Y.Z, X.Y, latest).
# Actions are pinned to full commit SHAs; the trailing comment is the release they resolve to.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # Use the runner's yarn rather than downloading it from GitHub releases (see build.gradle.kts).
  ORG_GRADLE_PROJECT_homegap.systemYarn: 'true'

jobs:
  test:
    name: Unit tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/yarn
            ~/Library/Caches/Yarn
          key: yarn-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', '**/build.gradle.kts') }}
          restore-keys: yarn-${{ runner.os }}-
      # The npm registry occasionally times out (504) on runners; retry before failing the job.
      - name: Install npm packages
        run: |
          command -v yarn >/dev/null || npm install --global yarn@1.22.22
          for attempt in 1 2 3; do
            ./gradlew kotlinNpmInstall && exit 0
            echo "::warning::kotlinNpmInstall failed (attempt $attempt of 3)"
            sleep 20
          done
          exit 1
      - name: Test
        run: ./gradlew macosArm64Test :presentation:jsNodeTest -Phomegap.skipWeb=true

  image:
    name: Build image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: zulu
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/yarn
            ~/Library/Caches/Yarn
          key: yarn-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml', '**/build.gradle.kts') }}
          restore-keys: yarn-${{ runner.os }}-
      # The npm registry occasionally times out (504) on runners; retry before failing the job.
      - name: Install npm packages
        run: |
          command -v yarn >/dev/null || npm install --global yarn@1.22.22
          for attempt in 1 2 3; do
            ./gradlew kotlinNpmInstall && exit 0
            echo "::warning::kotlinNpmInstall failed (attempt $attempt of 3)"
            sleep 20
          done
          exit 1

      # Both architectures are cross-compiled here with the dashboard bundle embedded;
      # the Dockerfile only copies the binaries in, so nothing compiles under emulation.
      - name: Build native binaries
        run: ./gradlew linkReleaseExecutableLinuxX64 linkReleaseExecutableLinuxArm64

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The cluster image every member runs (PostgreSQL with Patroni, etcd, Valkey, HAProxy),
      # tagged like the main image.
      - id: meta-cluster
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-cluster
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: cluster
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-cluster.outputs.tags }}
          labels: ${{ steps.meta-cluster.outputs.labels }}
          annotations: ${{ steps.meta-cluster.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=cluster
          cache-to: type=gha,mode=max,scope=cluster

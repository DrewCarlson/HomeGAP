# HomeGAP on the homelab: the orchestrator, the tunnel supervisor and the homelab's cluster
# database member.
#
# Do not edit this file: upgrade.sh replaces it with the file of the new version. Your settings
# go in two files next to it:
#   .env                   the secrets and the variables of this file (see .env.example)
#   compose.override.yml   every other change (see compose.override.example.yml). Docker
#                          Compose reads it after this file, with no extra argument.
#
#   docker compose up -d
#
# To upgrade, run ./upgrade.sh instead of `pull` + `up -d`: it moves the database and Valkey
# primaries to a node first, restarts the cluster containers one at a time, and only restarts
# the tunnel connectors when they changed, so access stays up throughout.
#
# Nothing secret lives in the image, the config or git.

name: homegap

# Each service keeps at most 30 MB of logs.
x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

networks:
  # Your existing Traefik network. Set its name in .env (TRAEFIK_NETWORK) if it is not "traefik".
  traefik:
    name: ${TRAEFIK_NETWORK:-traefik}
    external: true
  # Only the orchestrator and the Docker socket proxy: nothing else reaches the proxy.
  homegap-docker:
    internal: true
  # Between the orchestrator and the network namespace of the mesh (homegap-mesh), and the way
  # of that namespace out to the nodes (WireGuard). Nothing else joins it.
  homegap-cluster:

# Everything that HomeGAP writes is in folders below HOMEGAP_DATA_DIR (default ./data, next to this
# file). `homegap init` makes the folders of the orchestrator, with you as their owner. Docker makes
# the folders of the cluster member at the first start.
#   orchestrator/     the orchestrator's own data: the state cache (every credential), its SSH keys
#                     and the dashboard token. No other container mounts it.
#   tunnels/          connector specs, status and logs, shared with the tunnels container.
#   mesh/             what the orchestrator and the mesh agent tell each other, and the homelab's
#                     mesh key.
#   cluster/config/   the config that the orchestrator writes for the cluster containers.
#   cluster/postgres/, cluster/etcd/, cluster/valkey/, cluster/sentinel/
#                     the homelab's cluster member (only used when `cluster:` is configured).
# The cluster containers and the tunnels container each mount only their own folders, so they
# never see the orchestrator's data.

# The services with `profiles: [cluster]` are the homelab's part of cluster mode. They run only
# with COMPOSE_PROFILES=cluster in .env. The mesh containers run in each mode.

services:
  # Holds the network namespace of the mesh: the mesh interface (hg-mesh, see `mesh:` in the
  # config) and the homelab's cluster member live here, and nothing else does. Each node is a
  # member of the mesh, so this namespace is treated as reachable from the nodes: the
  # orchestrator is not in it, and the mesh agent's firewall lets nothing in it open a connection
  # to the orchestrator, to another container or to your home network. For a node, the namespace
  # forwards only the ports of the published services, each to its one container on the Traefik
  # network.
  homegap-mesh:
    # A fixed image, never the HomeGAP one: recreating this container replaces the namespace
    # (and drops the mesh), so it must not change with HomeGAP updates. Everything sharing the
    # namespace restarts with it if it ever is recreated (depends_on restart: true).
    image: docker.io/library/busybox:1.37
    entrypoint: ["sh", "-c", "trap 'exit 0' TERM INT; while :; do sleep 3600 & wait; done"]
    restart: unless-stopped
    logging: *logging
    # The orchestrator reaches the nodes' members through this namespace.
    sysctls:
      net.ipv4.ip_forward: "1"
    networks: [homegap-cluster, traefik]

  # Keeps the mesh interface and the namespace's firewall as the orchestrator describes them.
  # The only container in the namespace that can change its network.
  homegap-mesh-agent:
    image: ghcr.io/drewcarlson/homegap:${HOMEGAP_VERSION:-latest}
    command: ["mesh"]
    restart: unless-stopped
    logging: *logging
    network_mode: service:homegap-mesh
    # DAC_OVERRIDE: the agent runs as root, and the folder belongs to the user of the orchestrator.
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, NET_RAW, DAC_OVERRIDE]
    security_opt: ["no-new-privileges:true"]
    depends_on: { homegap-mesh: { condition: service_started, restart: true } }
    volumes:
      - "${HOMEGAP_DATA_DIR:-./data}/mesh:/mesh"

  orchestrator:
    image: ghcr.io/drewcarlson/homegap:${HOMEGAP_VERSION:-latest}
    command: ["run"]
    restart: unless-stopped
    logging: *logging
    networks:
      traefik: {}
      homegap-docker: {}
      homegap-cluster: {}
    # Speed tests and the status page (speedtest.enabled, status_page.enabled) need no labels here.
    # Traefik gets their route to port 8089 from the HTTP provider of the orchestrator
    # (providers.http.endpoint: http://orchestrator:8088/api/traefik/homelab).
    # The orchestrator is not root: it runs as the owner of this folder, so the files that it
    # writes in config/ and data/ belong to you. It has no capability. `homegap init` sets the two
    # variables in .env if the owner is not 1000:1000.
    user: "${HOMEGAP_UID:-1000}:${HOMEGAP_GID:-1000}"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      docker-proxy: { condition: service_started }
    # The dashboard, on the loopback address of the host only. Reach it through an SSH tunnel, or
    # set dashboard.hostname in the config to serve it through your Traefik.
    ports: ["${HOMEGAP_DASHBOARD_PUBLISH:-127.0.0.1:8088}:8088"]
    # Every variable of .env reaches the orchestrator, so a secret that the config names
    # (license_key_env, pin_env) needs no line here.
    env_file: [.env]
    environment:
      BUNNY_API_KEY: ${BUNNY_API_KEY:?set BUNNY_API_KEY in .env}
      PANGOLIN_LICENSE_KEY: ${PANGOLIN_LICENSE_KEY:-}
      # The dashboard's bearer token (dashboard.auth_token_env). Without one, HomeGAP generates a
      # token and keeps it in /data/dashboard-token.
      HOMEGAP_DASHBOARD_TOKEN: ${HOMEGAP_DASHBOARD_TOKEN:-}
      # Docker is read through the docker-proxy service: the orchestrator has no Docker socket.
      DOCKER_HOST: tcp://docker-proxy:2375
      # "true": discovery and the desired state in the log, no writes.
      HOMEGAP_DRY_RUN: ${HOMEGAP_DRY_RUN:-}
    volumes:
      # The folder, not only the file: an editor that replaces the file does not break the mount,
      # and the backups of dashboard edits (config.yml.bak-*) stay on the host.
      - ./config:/config
      # The state cache, known_hosts and the SSH keys of the nodes (in ssh/).
      - "${HOMEGAP_DATA_DIR:-./data}/orchestrator:/data"
      # The next paths are fixed in the image: mount each folder there, with no variable.
      - "${HOMEGAP_DATA_DIR:-./data}/cluster/config:/cluster-config"   # written here, read by the cluster containers
      - "${HOMEGAP_DATA_DIR:-./data}/tunnels:/tunnels"                 # connector specs, shared with the tunnels container
      - "${HOMEGAP_DATA_DIR:-./data}/mesh:/mesh"                       # the mesh description, shared with the mesh agent
      - "${HOMEGAP_DATA_DIR:-./data}/identity:/identity"               # the signed directory of users, read by the sign-in
      - "${HOMEGAP_DATA_DIR:-./data}/sign-in:/sign-in:ro"              # the public key of the sign-in

  # Keeps the route of the orchestrator to the mesh subnet. The orchestrator cannot change a
  # route as an ordinary user, so this container does it: root with only NET_ADMIN, in the network
  # namespace of the orchestrator. DAC_READ_SEARCH lets it read the mesh description of that user.
  homegap-mesh-route:
    image: ghcr.io/drewcarlson/homegap:${HOMEGAP_VERSION:-latest}
    command: ["mesh-route"]
    restart: unless-stopped
    logging: *logging
    network_mode: service:orchestrator
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, DAC_READ_SEARCH]
    security_opt: ["no-new-privileges:true"]
    depends_on: { orchestrator: { condition: service_started, restart: true } }
    volumes:
      - "${HOMEGAP_DATA_DIR:-./data}/mesh:/mesh:ro"

  # The public sign-in of HomeGAP: the page where a user signs in, and the calls of the apps for
  # it. It is a container of its own, so the part that the internet reaches has no SSH key, no
  # DNS key and no Docker access. It reads the signed directory of users and keeps its own key.
  homegap-sign-in:
    image: ghcr.io/drewcarlson/homegap:${HOMEGAP_VERSION:-latest}
    command: ["sign-in"]
    restart: unless-stopped
    logging: *logging
    networks: [traefik]
    user: "${HOMEGAP_UID:-1000}:${HOMEGAP_GID:-1000}"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    environment:
      # The client secret of the sign-in provider (sign_in.oidc.client_secret_env).
      HOMEGAP_OIDC_CLIENT_SECRET: ${HOMEGAP_OIDC_CLIENT_SECRET:-}
    volumes:
      # The sign-in reads the part sign_in of the config. Start it again after a change of that part.
      - ./config:/config:ro
      - "${HOMEGAP_DATA_DIR:-./data}/identity:/identity:ro"
      - "${HOMEGAP_DATA_DIR:-./data}/sign-in:/sign-in"

  # A filtering proxy in front of the Docker socket. A socket mount gives the whole Docker API
  # whatever its mount mode, and with it control of this host. The orchestrator only needs to
  # read the container list, events and image metadata, so that is all the proxy lets through
  # (GET only), and only the orchestrator can reach it.
  docker-proxy:
    image: docker.io/tecnativa/docker-socket-proxy:v0.5.0
    restart: unless-stopped
    logging: *logging
    environment:
      CONTAINERS: 1
      IMAGES: 1
      EVENTS: 1
      POST: 0
    volumes: ["/var/run/docker.sock:/var/run/docker.sock:ro"]
    networks: [homegap-docker]

  # ---------------------------------------------------------------------------------------
  # The homelab's cluster member (only used when `cluster:` is configured; until then they wait).
  # They live in the homegap-mesh namespace and read the config the orchestrator writes into the
  # cluster/config folder. They mount nothing else of the orchestrator's. The homelab holds the database primary by default; while it is down a
  # node takes over, and the orchestrator switches it back once the homelab is caught up.
  homegap-etcd:
    image: ghcr.io/drewcarlson/homegap-cluster:${HOMEGAP_VERSION:-latest}
    profiles: [cluster]
    command: [etcd]
    restart: unless-stopped
    logging: *logging
    network_mode: service:homegap-mesh
    depends_on: { homegap-mesh: { condition: service_started, restart: true } }
    security_opt: ["no-new-privileges:true"]
    volumes:
      - "${HOMEGAP_DATA_DIR:-./data}/cluster/config:/config:ro"
      - "${HOMEGAP_DATA_DIR:-./data}/cluster/etcd:/var/lib/etcd"

  homegap-db:
    image: ghcr.io/drewcarlson/homegap-cluster:${HOMEGAP_VERSION:-latest}
    profiles: [cluster]
    command: [patroni]
    restart: unless-stopped
    logging: *logging
    network_mode: service:homegap-mesh
    depends_on: { homegap-mesh: { condition: service_started, restart: true } }
    shm_size: 256m
    stop_grace_period: 60s
    security_opt: ["no-new-privileges:true"]
    environment:
      HG_BACKUP_DIR: /backups          # nightly pg_dump, newest seven kept
    volumes:
      - "${HOMEGAP_DATA_DIR:-./data}/cluster/config:/config:ro"
      - "${HOMEGAP_DATA_DIR:-./data}/cluster/postgres:/var/lib/postgresql/data"
      - ./backups:/backups

  homegap-valkey:
    image: ghcr.io/drewcarlson/homegap-cluster:${HOMEGAP_VERSION:-latest}
    profiles: [cluster]
    command: [valkey]
    restart: unless-stopped
    logging: *logging
    network_mode: service:homegap-mesh
    depends_on: { homegap-mesh: { condition: service_started, restart: true } }
    security_opt: ["no-new-privileges:true"]
    volumes:
      - "${HOMEGAP_DATA_DIR:-./data}/cluster/config:/config:ro"
      - "${HOMEGAP_DATA_DIR:-./data}/cluster/valkey:/data"

  homegap-sentinel:
    image: ghcr.io/drewcarlson/homegap-cluster:${HOMEGAP_VERSION:-latest}
    profiles: [cluster]
    command: [sentinel]
    restart: unless-stopped
    logging: *logging
    network_mode: service:homegap-mesh
    depends_on: { homegap-mesh: { condition: service_started, restart: true } }
    security_opt: ["no-new-privileges:true"]
    volumes:
      - "${HOMEGAP_DATA_DIR:-./data}/cluster/config:/config:ro"
      - "${HOMEGAP_DATA_DIR:-./data}/cluster/sentinel:/var/lib/sentinel"

  # Keeps one Newt connector per regional node running. Independent of the orchestrator:
  # if the controller stops or restarts, tunnels stay up.
  tunnels:
    image: ghcr.io/drewcarlson/homegap:${HOMEGAP_VERSION:-latest}
    command: ["tunnels"]
    restart: unless-stopped
    logging: *logging
    # For kernel WireGuard (tunnels.native: true in the config).
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun:/dev/net/tun"]
    # TCP settings are per network namespace, so the host's sysctls do not reach this
    # container. In native mode the homelab end of every node -> homelab connection lives
    # here, and the defaults (cubic, 4 MiB send buffer) cap long-distance downloads.
    sysctls:
      net.ipv4.tcp_rmem: "4096 131072 67108864"
      net.ipv4.tcp_wmem: "4096 65536 67108864"
      net.ipv4.tcp_slow_start_after_idle: "0"
      net.ipv4.tcp_mtu_probing: "1"
      # Tolerate packet reordering on long routes instead of treating it as loss.
      net.ipv4.tcp_reordering: "10"
      net.ipv4.tcp_max_reordering: "1000"
    volumes:
      - "${HOMEGAP_DATA_DIR:-./data}/tunnels:/tunnels"
    # More networks, a fixed address and BBR go in compose.override.yml.
    networks:
      traefik: {}

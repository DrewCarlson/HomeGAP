# REFERENCE ONLY — the node stack HomeGAP renders over SSH into <install_dir>/compose.yml.
# The canonical template lives in src/nativeMain/kotlin/homegap/provision/NodeTemplates.kt;
# print the effective files for a node with:  homegap render-node <id> --config config.yml
# Raw TCP/UDP labels add "<port>:<port>/<proto>" entries to gerbil.ports (and Traefik entrypoints).

name: "homegap"
services:
  pangolin:
    image: "docker.io/fosrl/pangolin:ee-1.26.0"
    container_name: "pangolin"
    restart: "unless-stopped"
    env_file:
      - ".env"
    volumes:
      - "./config:/app/config"
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:3002:3002"
      - "127.0.0.1:3003:3003"
    healthcheck:
      test:
        - "CMD"
        - "curl"
        - "-f"
        - "http://localhost:3001/api/v1/"
      interval: "10s"
      timeout: "10s"
      retries: 15
  gerbil:
    image: "docker.io/fosrl/gerbil:1.6.0"
    container_name: "gerbil"
    restart: "unless-stopped"
    depends_on:
      pangolin:
        condition: "service_healthy"
    command:
      - "--reachableAt=http://gerbil:3004"
      - "--generateAndSaveKeyTo=/var/config/key"
      - "--remoteConfig=http://pangolin:3001/api/v1/"
    volumes:
      - "./config/:/var/config"
    cap_add:
      - "NET_ADMIN"
      - "SYS_MODULE"
    ports:
      - "51820:51820/udp"
      - "21820:21820/udp"
      - "443:443"
      - "443:443/udp"
      - "80:80"
  traefik:
    image: "docker.io/traefik:v3.7.16"
    container_name: "traefik"
    restart: "unless-stopped"
    network_mode: "service:gerbil"
    depends_on:
      pangolin:
        condition: "service_healthy"
    command:
      - "--configFile=/etc/traefik/traefik_config.yml"
    volumes:
      - "./config/traefik:/etc/traefik:ro"
      - "./config/letsencrypt:/letsencrypt"
      - "./config/traefik/logs:/var/log/traefik"
networks:
  default:
    driver: "bridge"
    name: "homegap_node"


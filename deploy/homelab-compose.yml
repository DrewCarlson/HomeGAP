# HomeGAP on the homelab: the orchestrator, the tunnel supervisor and the homelab's cluster
# database member. Merge into your existing homelab compose project or run
# alongside it; the tunnel supervisor must share a Docker network with Traefik and with any
# service that is exposed directly (raw TCP/UDP or dedicated subdomains).
#
#   docker compose -f deploy/homelab-compose.yml up -d
#
# To upgrade, run deploy/upgrade.sh (same arguments) instead of `pull` + `up -d`: it moves the
# database and Valkey primaries to a node first, restarts the cluster containers one at a time,
# and only restarts the tunnel connectors when they changed, so access stays up throughout.
#
# Secrets come from the environment (.env next to this file) or Docker secrets; nothing secret
# lives in the image, the config or git.

name: homegap

# Each service keeps at most 30 MB of logs.
x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

networks:
  # Your existing Traefik network. Create it beforehand or replace with your own name.
  traefik:
    external: true
  # Only the orchestrator and the Docker socket proxy: nothing else reaches the proxy.
  homegap-docker:
    internal: true
  # Between the orchestrator and the cluster's own network namespace (homegap-mesh), and that
  # namespace's way out to the nodes (WireGuard). Nothing else joins it.
  homegap-cluster:

volumes:
  # The orchestrator's own data: the state cache (every credential), the SSH keys it generates and
  # the dashboard token. No other container mounts it.
  homegap-data:
  # What the cluster containers read (the config the orchestrator writes for them), and what the
  # tunnels container reads and writes (connector specs, status, logs). Each has its own volume,
  # so those containers never see the orchestrator's data.
  homegap-cluster-config:
  homegap-tunnels:
  # What the orchestrator and the mesh agent tell each other, and the homelab's mesh key.
  homegap-mesh:
  # The homelab's cluster member (only used when `cluster:` is configured).
  homegap-etcd:
  homegap-pgdata:
  homegap-valkey:
  homegap-sentinel:

services:
  # Holds the cluster's own network namespace: the mesh interface (hg-mesh, see `cluster:` in the
  # config) and the homelab's cluster member live here, and nothing else does. Every node is a
  # member of the cluster database, so this namespace is treated as reachable from the nodes: the
  # orchestrator is not in it, and the mesh agent's firewall lets nothing in it open a connection
  # to the orchestrator, to another container or to your home network.
  homegap-mesh:
    # A fixed image, never the HomeGAP one: recreating this container replaces the namespace
    # (and drops the mesh), so it must not change with HomeGAP updates. Everything sharing the
    # namespace restarts with it if it ever is recreated (depends_on restart: true).
    image: docker.io/library/busybox:1.37
    entrypoint: ["sh", "-c", "trap 'exit 0' TERM INT; while :; do sleep 3600 & wait; done"]
    restart: unless-stopped
    logging: *logging
    # The orchestrator reaches the nodes' members through this namespace.
    sysctls:
      net.ipv4.ip_forward: "1"
    networks: [homegap-cluster]

  # Keeps the mesh interface and the namespace's firewall as the orchestrator describes them
  # (only used when `cluster:` is configured; until then it waits). The only container in the
  # namespace that can change its network.
  homegap-mesh-agent:
    image: ghcr.io/drewcarlson/homegap:latest
    command: ["mesh"]
    restart: unless-stopped
    logging: *logging
    network_mode: service:homegap-mesh
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, NET_RAW]
    security_opt: ["no-new-privileges:true"]
    depends_on: { homegap-mesh: { condition: service_started, restart: true } }
    environment: { HOMEGAP_MESH_DIR: /mesh }
    volumes: [homegap-mesh:/mesh]

  orchestrator:
    image: ghcr.io/drewcarlson/homegap:latest
    command: ["run"]
    restart: unless-stopped
    logging: *logging
    networks:
      traefik: {}
      homegap-docker: {}
      homegap-cluster: {}
    # Speed tests and the status page (speedtest.enabled, status_page.enabled): route their names
    # here on port 8089.
    # labels:
    #   traefik.enable: "true"
    #   traefik.http.routers.homegap-speedtest.rule: "Host(`speedtest.example.net`) || HostRegexp(`^(speedtest|status)-[a-z0-9-]+\\.example\\.net$`)"
    #   traefik.http.routers.homegap-speedtest.entrypoints: websecure
    #   traefik.http.routers.homegap-speedtest.tls: "true"
    #   traefik.http.services.homegap-speedtest.loadbalancer.server.port: "8089"
    # Only what it needs: NET_ADMIN for its route to the mesh, and DAC_OVERRIDE to read the
    # mounted keys and config whoever owns them.
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, DAC_OVERRIDE]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      docker-proxy: { condition: service_started }
    environment:
      BUNNY_API_KEY: ${BUNNY_API_KEY:?set BUNNY_API_KEY}
      PANGOLIN_LICENSE_KEY: ${PANGOLIN_LICENSE_KEY:-}
      # The dashboard's bearer token (dashboard.auth_token_env). Without one, HomeGAP generates a
      # token and keeps it in /data/dashboard-token.
      HOMEGAP_DASHBOARD_TOKEN: ${HOMEGAP_DASHBOARD_TOKEN:-}
      HOMEGAP_CLUSTER_CONFIG_DIR: /cluster-config
      HOMEGAP_TUNNELS_DIR: /tunnels
      HOMEGAP_MESH_DIR: /mesh
      # Docker is read through the docker-proxy service: the orchestrator has no Docker socket.
      DOCKER_HOST: tcp://docker-proxy:2375
      # HOMEGAP_DRY_RUN: "true"     # discovery + logged desired state, no writes
    volumes:
      - ./config/config.yml:/config/config.yml          # writable only if dashboard config edits are enabled
      - ./secrets/ssh:/secrets/ssh:ro                   # one private key per node
      - homegap-data:/data                              # state cache, known_hosts, generated keys
      - homegap-cluster-config:/cluster-config          # written here, read by the cluster containers
      - homegap-tunnels:/tunnels                        # connector specs, shared with the tunnels container
      - homegap-mesh:/mesh                              # the mesh description, shared with the mesh agent
    # The dashboard must only be reachable privately (an SSH tunnel, or a *private* Pangolin
    # resource with alias e.g. homegap.<domain> -> orchestrator:8088), never publicly.

  # A filtering proxy in front of the Docker socket. A socket mount gives the whole Docker API
  # whatever its mount mode, and with it control of this host. The orchestrator only needs to
  # read the container list, events and image metadata, so that is all the proxy lets through
  # (GET only), and only the orchestrator can reach it.
  docker-proxy:
    image: docker.io/tecnativa/docker-socket-proxy:v0.5.0
    restart: unless-stopped
    logging: *logging
    environment:
      CONTAINERS: 1
      IMAGES: 1
      EVENTS: 1
      POST: 0
    volumes: ["/var/run/docker.sock:/var/run/docker.sock:ro"]
    networks: [homegap-docker]

  # ---------------------------------------------------------------------------------------
  # The homelab's cluster member (only used when `cluster:` is configured; until then they wait).
  # They live in the homegap-mesh namespace and read the config the orchestrator writes into the
  # homegap-cluster-config volume. They mount nothing else of the orchestrator's. The homelab holds the database primary by default; while it is down a
  # node takes over, and the orchestrator switches it back once the homelab is caught up.
  homegap-etcd:
    image: ghcr.io/drewcarlson/homegap-cluster:latest
    command: [etcd]
    restart: unless-stopped
    logging: *logging
    network_mode: service:homegap-mesh
    depends_on: { homegap-mesh: { condition: service_started, restart: true } }
    security_opt: ["no-new-privileges:true"]
    environment: { HG_CONFIG: /cluster-config }
    volumes: [homegap-cluster-config:/cluster-config:ro, homegap-etcd:/var/lib/etcd]

  homegap-db:
    image: ghcr.io/drewcarlson/homegap-cluster:latest
    command: [patroni]
    restart: unless-stopped
    logging: *logging
    network_mode: service:homegap-mesh
    depends_on: { homegap-mesh: { condition: service_started, restart: true } }
    shm_size: 256m
    stop_grace_period: 60s
    security_opt: ["no-new-privileges:true"]
    environment:
      HG_CONFIG: /cluster-config
      HG_BACKUP_DIR: /backups          # nightly pg_dump, newest seven kept
    volumes:
      - homegap-cluster-config:/cluster-config:ro
      - homegap-pgdata:/var/lib/postgresql/data
      - ./backups:/backups

  homegap-valkey:
    image: ghcr.io/drewcarlson/homegap-cluster:latest
    command: [valkey]
    restart: unless-stopped
    logging: *logging
    network_mode: service:homegap-mesh
    depends_on: { homegap-mesh: { condition: service_started, restart: true } }
    security_opt: ["no-new-privileges:true"]
    environment: { HG_CONFIG: /cluster-config, HG_VALKEY_DIR: /var/lib/valkey }
    volumes: [homegap-cluster-config:/cluster-config:ro, homegap-valkey:/var/lib/valkey]

  homegap-sentinel:
    image: ghcr.io/drewcarlson/homegap-cluster:latest
    command: [sentinel]
    restart: unless-stopped
    logging: *logging
    network_mode: service:homegap-mesh
    depends_on: { homegap-mesh: { condition: service_started, restart: true } }
    security_opt: ["no-new-privileges:true"]
    environment: { HG_CONFIG: /cluster-config }
    volumes: [homegap-cluster-config:/cluster-config:ro, homegap-sentinel:/var/lib/sentinel]

  # Keeps one Newt connector per regional node running. Independent of the orchestrator:
  # if the controller stops or restarts, tunnels stay up.
  tunnels:
    image: ghcr.io/drewcarlson/homegap:latest
    command: ["tunnels", "--dir", "/tunnels"]
    restart: unless-stopped
    logging: *logging
    # Kernel WireGuard (tunnels.native: true) needs these:
    # cap_add: [NET_ADMIN]
    # devices: ["/dev/net/tun:/dev/net/tun"]
    # TCP settings are per network namespace, so the host's sysctls do not reach this
    # container. In native mode the homelab end of every node -> homelab connection lives
    # here, and the defaults (cubic, 4 MiB send buffer) cap long-distance downloads.
    sysctls:
      net.ipv4.tcp_rmem: "4096 131072 67108864"
      net.ipv4.tcp_wmem: "4096 65536 67108864"
      net.ipv4.tcp_slow_start_after_idle: "0"
      net.ipv4.tcp_mtu_probing: "1"
      # Tolerate packet reordering on long routes instead of treating it as loss.
      net.ipv4.tcp_reordering: "10"
      net.ipv4.tcp_max_reordering: "1000"
      # Needs the tcp_bbr module loaded on the host (`modprobe tcp_bbr`), or the container
      # will not start.
      # net.ipv4.tcp_congestion_control: bbr
    volumes:
      - homegap-tunnels:/tunnels
    networks: [traefik]
    # For real client IPs and private-only services (homegap.proxy_protocol and
    # homegap.private_network on the front door), give it a fixed address to trust and a second
    # network shared only with your Traefik; see
    # https://drewcarlson.github.io/HomeGAP/latest/services/client-addresses/
    # networks:
    #   traefik: { ipv4_address: 172.32.0.250 }
    #   homegap-private: {}

  # Example front door claim: label your existing Traefik container like this instead.
  # traefik:
  #   labels:
  #     homegap.expose: "example.net"
  #     homegap.wildcard: "true"
  #     homegap.protocol: "https"
  #     homegap.tls: "passthrough"   # flip to "terminate" to let nodes end TLS

# HomeGAP on the homelab: the orchestrator, the tunnel supervisor and (optionally) the
# hand-curated primary Pangolin EE. Merge into your existing homelab compose project or run
# alongside it; the tunnel supervisor must share a Docker network with Traefik and with any
# service that is exposed directly (raw TCP/UDP or dedicated subdomains).
#
#   docker compose -f deploy/homelab-compose.yml up -d
#
# Secrets come from the environment (.env next to this file) or Docker secrets; nothing secret
# lives in the image, the config or git.

name: homegap

networks:
  # Your existing Traefik network. Create it beforehand or replace with your own name.
  traefik:
    external: true

volumes:
  homegap-data:

services:
  # Holds the orchestrator's network namespace, so the cluster mesh interface (hg-mesh, see
  # `cluster:` in the config) outlives orchestrator restarts and upgrades. The orchestrator's
  # networks, published ports and Traefik labels belong here.
  homegap-mesh:
    image: ghcr.io/drewcarlson/homegap:latest
    entrypoint: ["/usr/bin/tini", "--", "sleep", "infinity"]
    restart: unless-stopped
    networks:
      traefik:
        aliases: [orchestrator]
    # Speed tests (speedtest.enabled: true): route speedtest*.<domain> here on port 8089.
    # labels:
    #   traefik.enable: "true"
    #   traefik.http.routers.homegap-speedtest.rule: "Host(`speedtest.example.net`) || HostRegexp(`^speedtest-[a-z0-9-]+\\.example\\.net$`)"
    #   traefik.http.routers.homegap-speedtest.entrypoints: websecure
    #   traefik.http.routers.homegap-speedtest.tls: "true"
    #   traefik.http.services.homegap-speedtest.loadbalancer.server.port: "8089"

  orchestrator:
    image: ghcr.io/drewcarlson/homegap:latest
    command: ["run"]
    restart: unless-stopped
    network_mode: service:homegap-mesh
    # Manages the cluster mesh interface (only used when `cluster:` is configured).
    cap_add: [NET_ADMIN]
    depends_on: [homegap-mesh]
    environment:
      BUNNY_API_KEY: ${BUNNY_API_KEY:?set BUNNY_API_KEY}
      PRIMARY_PANGOLIN_KEY: ${PRIMARY_PANGOLIN_KEY:-}
      PANGOLIN_LICENSE_KEY: ${PANGOLIN_LICENSE_KEY:-}
      # HOMEGAP_DRY_RUN: "true"     # discovery + logged desired state, no writes
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro   # read-only: labels are only read
      - ./config/config.yml:/config/config.yml          # writable only if dashboard config edits are enabled
      - ./secrets/ssh:/secrets/ssh:ro                   # one private key per node
      - homegap-data:/data                              # state cache, known_hosts, tunnel specs
      # Optional: the homelab Traefik ACME store, so nodes get the same wildcard certificate.
      # - /path/to/traefik/acme.json:/homelab/traefik/acme.json:ro
    # The dashboard must only be reachable privately: expose it as a *private* Pangolin
    # resource on the primary (alias e.g. homegap.<domain> -> orchestrator:8088), not publicly.

  # Keeps one Newt connector per regional node running. Independent of the orchestrator:
  # if the controller stops or restarts, tunnels stay up.
  tunnels:
    image: ghcr.io/drewcarlson/homegap:latest
    command: ["tunnels", "--dir", "/data/tunnels"]
    restart: unless-stopped
    # Kernel WireGuard (tunnels.native: true) needs these:
    # cap_add: [NET_ADMIN]
    # devices: ["/dev/net/tun:/dev/net/tun"]
    # TCP settings are per network namespace, so the host's sysctls do not reach this
    # container. In native mode the homelab end of every node -> homelab connection lives
    # here, and the defaults (cubic, 4 MiB send buffer) cap long-distance downloads.
    sysctls:
      net.ipv4.tcp_rmem: "4096 131072 67108864"
      net.ipv4.tcp_wmem: "4096 65536 67108864"
      net.ipv4.tcp_slow_start_after_idle: "0"
      net.ipv4.tcp_mtu_probing: "1"
      # Tolerate packet reordering on long routes instead of treating it as loss.
      net.ipv4.tcp_reordering: "10"
      net.ipv4.tcp_max_reordering: "1000"
      # Needs the tcp_bbr module loaded on the host (`modprobe tcp_bbr`), or the container
      # will not start.
      # net.ipv4.tcp_congestion_control: bbr
    volumes:
      - homegap-data:/data
    networks: [traefik]

  # ---------------------------------------------------------------------------------------
  # Primary Pangolin EE (manual anchor: private/client access, identity, escape hatch).
  # Stand it up by hand once (see README "Bootstrap"), create an org, a site for the homelab
  # and an Integration API key with private-resource permissions for the orchestrator.
  # Remove this block if you already run one.
  pangolin:
    image: docker.io/fosrl/pangolin:ee-1.26.0
    restart: unless-stopped
    volumes:
      - ./pangolin/config:/app/config
    networks: [traefik]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/v1/"]
      interval: 10s
      timeout: 10s
      retries: 15

  # Example front door claim: label your existing Traefik container like this instead.
  # traefik:
  #   labels:
  #     homegap.expose: "example.net"
  #     homegap.wildcard: "true"
  #     homegap.protocol: "https"
  #     homegap.tls: "passthrough"   # flip to "terminate" to let nodes end TLS

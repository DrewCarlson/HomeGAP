# HomeGAP controller configuration.
#
# Secrets are never written here: `*_env` fields name environment variables and `*_file`
# fields name mounted files. `/run/secrets/<ENV_NAME>` is also checked for `*_env` references.

project: home-gap
# Start on a test domain hosted at Bunny that nothing depends on yet (a spare domain or a
# delegated subdomain); switch to your production domain once everything is verified.
domain: test.example.net
data_dir: /data

reconcile:
  resync_interval: 60s        # periodic full resync (drift repair)
  debounce: 2s                # Docker event debounce
  node_check_interval: 5m     # SSH drift check per node
  dns_check_interval: 5m      # re-read the Bunny zone this often when nothing changed
  dry_run: false              # discovery + logged desired state, no writes

bunny:
  zone: test.example.net      # equal to, or a parent of, `domain`
  api_key_env: BUNNY_API_KEY
  ttl: 60
  routing: geolocation        # geolocation | latency | none
  monitor: http               # http (port 80, through the tunnel) | ping | none

pangolin:
  acme_email: ops@test.example.net
  org_id: homegap
  # Pangolin EE license (free below the commercial threshold). Required for wildcard
  # resources in `terminate` mode; passthrough works without it.
  # A key is bound to ONE Pangolin instance when it is first activated.
  # - With `cluster:`, every node is one Pangolin: this one key covers them all, and per-node
  #   keys are ignored.
  # - Without it, each node needs its own key (nodes[].license_key_env); this default only
  #   suits a single node.
  # See https://drewcarlson.github.io/HomeGAP/latest/configuration/licenses/
  # license_key_env: PANGOLIN_LICENSE_KEY
  crowdsec: false
  # base_blueprint: /config/blueprints/base.yml

# Wildcard + root certificate pushed to every node so `terminate` mode is instant.
# none | files | acme_json (read the homelab Traefik's ACME store, mounted read-only).
certificates:
  source: acme_json
  acme_json: /homelab/traefik/acme.json
  resolver: bunny

# Optional: clustered Pangolin's private WireGuard mesh and its shared database (PostgreSQL and
# Valkey on the homelab and every node). The orchestrator needs NET_ADMIN; see
# deploy/homelab-compose.yml.
# cluster:
#   mesh:
#     subnet: 10.77.0.0/24   # must not overlap 100.64.0.0/10
#     port: 51821            # udp, opened in each node's firewall
#   image: ghcr.io/drewcarlson/homegap-cluster:latest
#   primary:
#     preferred: homelab     # where the database primary lives whenever it can
#     switch_back_after: 10m # how long the homelab must be caught up before it takes over again
#   client_hostname: pangolin  # pangolin.<domain>: what the Pangolin apps connect to (nearest node)
#   exit_nodes:              # internet exits the Pangolin apps can pick (all traffic, like a VPN)
#     nodes: true            # "Exit via <node>": leaves with that node's address
#     homelab: true          # "Exit via homelab": relayed by the nearest node, leaves from home
#     roles: [Member]        # who may use them (Admin always can)

nodes:
  - id: na1
    region: NA
    provider: vps-provider-a
    host: 203.0.113.10
    os: ubuntu-24.04
    ssh_user: deploy
    ssh_key_file: /secrets/ssh/na1
    license_key_env: PANGOLIN_LICENSE_KEY_NA1
    # Optional: allow SSH through the firewall only from these sources. Locks the orchestrator
    # out if its public IP leaves the list; see
    # https://drewcarlson.github.io/HomeGAP/latest/getting-started/add-node/#4-firewall
    # ssh_allow_from: [198.51.100.0/24]
    location: { latitude: 40.71, longitude: -74.01, name: "New York" }
  - id: na2
    region: NA
    provider: vps-provider-b
    host: 198.51.100.20
    os: ubuntu-22.04
    ssh_user: deploy
    ssh_key_file: /secrets/ssh/na2
    license_key_env: PANGOLIN_LICENSE_KEY_NA2
    location: { latitude: 47.61, longitude: -122.33, name: Seattle }

# Tunnel tuning; see https://drewcarlson.github.io/HomeGAP/latest/operations/performance/
tunnels:
  mtu: 1420
  # Kernel WireGuard for Newt; the tunnels container needs NET_ADMIN and /dev/net/tun.
  native: false

# Speed tests (dashboard "Speed test" tab). Route speedtest*.<domain> to port 8089 in the homelab proxy.
speedtest:
  enabled: false
  hostname: speedtest
  bind: 0.0.0.0:8089
  link_ttl: 2h
  streams: 4                # parallel streams for homelab <-> node tests

# A public status page at status.<domain>: the visitor's node, every node's state and the visitor's
# round trip through each. Shares speedtest.bind: also route status-*.<domain> to port 8089.
# Where the homelab is, for the maps (also settable on the dashboard's Locations page).
# The public status page only ever shows its region.
# homelab:
#   location: { latitude: 32.78, longitude: -96.8, name: "Dallas, Texas" }

status_page:
  enabled: false
  # hostname: status
  # title: Status

dashboard:
  bind: 0.0.0.0:8088
  # auth_token_env: HOMEGAP_DASHBOARD_TOKEN
  allow_config_edits: true

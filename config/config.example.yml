# HomeGAP controller configuration.
#
# Secrets are never written here: `*_env` fields name environment variables and `*_file`
# fields name mounted files. `/run/secrets/<ENV_NAME>` is also checked for `*_env` references.

project: home-gap
# Start on a test domain hosted at Bunny that nothing depends on yet (a spare domain or a
# delegated subdomain); switch to your production domain once everything is verified.
domain: test.example.net
data_dir: /data

reconcile:
  resync_interval: 60s        # periodic full resync (drift repair)
  debounce: 2s                # Docker event debounce
  node_check_interval: 5m     # SSH drift check per node
  dns_check_interval: 5m      # re-read the Bunny zone this often when nothing changed
  dry_run: false              # discovery + logged desired state, no writes

bunny:
  zone: test.example.net      # equal to, or a parent of, `domain`
  api_key_env: BUNNY_API_KEY
  ttl: 60
  routing: geolocation        # geolocation | latency | none
  monitor: http               # http (port 80 of the node, through to the homelab) | ping | none

# What each node runs: Traefik, the maintenance page, the agent of HomeGAP and, with `crowdsec`,
# CrowdSec. Each key has a default.
node_stack:
  crowdsec: false
  # install_dir: /opt/homegap
  # tcp_tuning: true          # BBR and larger TCP buffers on the node

# The certificate of the nodes. HomeGAP orders it from Let's Encrypt with the DNS challenge, for
# the names that a node terminates and no others. A node never gets a certificate for a
# passthrough name. See https://drewcarlson.github.io/HomeGAP/latest/configuration/certificates/
acme:
  email: ops@test.example.net     # the address of the Let's Encrypt account
  # staging: true                 # Let's Encrypt staging, for tests
  # CAA records for the domain: only Let's Encrypt, only with the DNS challenge. They also apply
  # to the Traefik of your homelab. Set false if it uses another authority or challenge.
  caa: true

# The private WireGuard mesh between the homelab and each node. It is always on.
# mesh:
#   subnet: 10.77.0.0/24   # must not overlap 100.64.0.0/10
#   port: 51821            # udp, opened in each node's firewall

# The agent of HomeGAP that each node runs. The tag of the default image is the value of
# HOMEGAP_VERSION. Without that variable, the tag is the version of the orchestrator.
# agent:
#   image: ghcr.io/drewcarlson/homegap:0.1.0

# HomeGAP's own sign-in for the apps. A user signs in with a HomeGAP password, or through an
# OpenID Connect provider such as Authelia. The provider proves who the user is. The user must
# exist in HomeGAP with the same email address. Without `url`, there is no sign-in and no VPN.
# sign_in:
#   url: https://vpn.test.example.net   # the address to put into the apps. Each node serves it.
#   passwords: true          # false: accept only the provider
#   oidc:
#     name: Authelia         # the name on the button
#     issuer: https://auth.example.net
#     client_id: homegap
#     client_secret_env: HOMEGAP_OIDC_CLIENT_SECRET   # a variable of the sign-in container
#     # The redirect address to give the provider is <url>/auth/oidc/callback.

# The VPN of the devices that sign in.
# vpn:
#   port: 51830              # udp on each node, which forwards it to the homelab
#   exit_port: 51840         # udp on each node, for the devices that use the node as their exit
#   exit_nodes:              # internet exits that the apps can pick (all traffic)
#     nodes: true            # "Exit via <node>": leaves with the address of that node
#     homelab: true          # "Exit via homelab": leaves from home
#     roles: [Member]        # who can use them (Admin always can)
#   tunnel_dns:              # DNS servers that the apps reach with "DNS over tunnel", with no exit
#     resolvers: ["8.8.8.8"] # HomeGAP sets them in each app. [] turns it off
#     roles: [Member]        # who can use them (Admin always can)

nodes:
  - id: na1
    region: NA
    provider: vps-provider-a
    host: 203.0.113.10
    os: ubuntu-24.04
    ssh_user: deploy
    ssh_key_file: /data/ssh/na1
    # Optional: allow SSH through the firewall only from these sources. Locks the orchestrator
    # out if its public IP leaves the list; see
    # https://drewcarlson.github.io/HomeGAP/latest/getting-started/add-node/#4-firewall
    # ssh_allow_from: [198.51.100.0/24]
    location: { latitude: 40.71, longitude: -74.01, name: "New York" }
  - id: na2
    region: NA
    provider: vps-provider-b
    host: 198.51.100.20
    os: ubuntu-22.04
    ssh_user: deploy
    ssh_key_file: /data/ssh/na2
    location: { latitude: 47.61, longitude: -122.33, name: Seattle }

# Speed tests (dashboard "Speed test" tab). Route speedtest*.<domain> to port 8089 in the homelab proxy.
speedtest:
  enabled: false
  hostname: speedtest
  bind: 0.0.0.0:8089
  link_ttl: 2h
  # vpn_access: true        # VPN devices open the page with no link (needs homegap.private_network)
  streams: 4                # parallel streams for homelab <-> node tests

# A public status page at status.<domain>: the visitor's node, every node's state and the visitor's
# round trip through each. Shares speedtest.bind: also route status-*.<domain> to port 8089.
# Where the homelab is, for the maps (also settable on the dashboard's Locations page).
# The public status page only ever shows its region.
# homelab:
#   location: { latitude: 32.78, longitude: -96.8, name: "Dallas, Texas" }
#   ssh:                     # SSH to the homelab host, for VPN devices only
#     enabled: true          # the name is ssh.<domain>
#     roles: [Member]        # who may use it (Admin always can)

status_page:
  enabled: false
  # hostname: status
  # title: Status

dashboard:
  bind: 0.0.0.0:8088
  # Every /api route needs this bearer token. If the variable is empty, HomeGAP generates a token
  # and keeps it in <data_dir>/dashboard-token.
  auth_token_env: HOMEGAP_DASHBOARD_TOKEN
  allow_config_edits: true
  # hostname: orc            # your Traefik serves the dashboard at orc.<domain>
  # access: private          # private: VPN devices only (needs homegap.private_network on
  #                          # the front door). public: everybody, with only the token as protection.
  # sso:                     # sign-in through a forward-auth middleware of your Traefik (Authelia)
  #   middleware: authelia@docker
  #   groups: [admins]             # full access
  #   read_only_groups: [family]   # can only look

# HomeGAP config: the settings that most homelabs need.
#
# Set the values of the first three sections before the first start. For each other key and its
# default, see config.example.yml in this folder and
# https://drewcarlson.github.io/HomeGAP/latest/configuration/reference/
#
# This file holds no secrets. A `*_env` key names a variable of the .env file.

# The domain of your services. Its DNS zone must be at Bunny.
domain: example.net

bunny:
  zone: example.net                # equal to `domain`, or a parent of it
  api_key_env: BUNNY_API_KEY

pangolin:
  acme_email: you@example.net      # the address of the Let's Encrypt account
  # The Pangolin EE license, optional. Remove the `#` after you set the key in .env.
  # license_key_env: PANGOLIN_LICENSE_KEY

reconcile:
  # The first start is a dry run: HomeGAP shows its plan in the log and on the Config page of
  # the dashboard, and changes nothing. Set false when the plan is correct.
  dry_run: true

# The servers that carry your traffic. Leave the list empty to add them with the Add node
# wizard of the dashboard, which writes each node here. Or add them by hand:
nodes: []
# nodes:
#   - id: na1
#     region: NA                   # NA, SA, EU, AF, ME, AS or OC
#     host: 203.0.113.10
#     os: ubuntu-24.04
#     ssh_user: deploy
#     ssh_key_file: /data/ssh/na1  # the file data/orchestrator/ssh/na1 of this folder
#     location: { latitude: 40.71, longitude: -74.01, name: "New York" }

# Cluster mode: one Pangolin on all nodes, with a shared database. Remove the `#`, and also set
# COMPOSE_PROFILES=cluster in .env.
# cluster: {}

dashboard:
  bind: 0.0.0.0:8088
  auth_token_env: HOMEGAP_DASHBOARD_TOKEN
  # To serve the dashboard at orc.<domain> through your Traefik, for Pangolin clients only:
  # hostname: orc
  # access: private

# Where the homelab is, for the maps. The public status page shows only its region.
# homelab:
#   location: { latitude: 32.78, longitude: -96.8, name: "Dallas, Texas" }

# The public status page at status.<domain>.
status_page:
  enabled: false

# Speed tests between your devices, the nodes and the homelab.
speedtest:
  enabled: false

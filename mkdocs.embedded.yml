# The build the orchestrator serves at /docs/ on its dashboard: one version (the image's own),
# relative links, and nothing loaded from another site.
INHERIT: mkdocs.yml
site_url: ''
use_directory_urls: true
site_dir: site-embedded
theme:
  # The repository link without its live stars and forks (fetched from api.github.com).
  custom_dir: overrides/embedded
plugins:
  - search
  - markdownextradata: {}
extra:
  hg_version: !ENV [VERSION, 'dev']
  hg_embedded: true
  version: null

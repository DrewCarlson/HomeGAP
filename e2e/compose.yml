# End-to-end harness: fake regional nodes (DinD VPS), a simulated homelab, the
# orchestrator, the mesh, the sign-in and a Bunny API stand-in, on one private network.
# Run ./run.sh rather than using this file directly.
name: homegap-e2e

networks:
  e2e:
    ipam:
      config:
        - subnet: 172.30.0.0/24
          # Containers without a fixed address get theirs from the upper half, so one of them
          # never takes a node's fixed address before that node starts.
          ip_range: 172.30.0.128/25
  # Only the orchestrator and the Docker socket proxy, as in deploy/compose.yml.
  e2e-docker:
    internal: true
  # Only the mesh namespace and the homelab Traefik: the traffic of VPN devices arrives from here,
  # so the homelab Traefik can tell it from public traffic (homegap.private_network).
  e2e-private:
    ipam:
      config:
        - subnet: 172.29.0.0/24

volumes:
  node-docker:
  node-opt:
  node-as1-docker:
  node-as1-opt:
  node-fr1-docker:

services:
  node-na1:
    build: { context: ., dockerfile: node.Dockerfile }
    privileged: true
    hostname: node-na1
    volumes:
      - ./work/keys:/keys:ro
      - node-docker:/var/lib/docker
      # The stack of the node stays over a restart of the harness.
      - node-opt:/opt/homegap
    networks:
      e2e:
        ipv4_address: 172.30.0.10
        aliases: [node-na1.test.example.net]

  node-as1:
    build: { context: ., dockerfile: node.Dockerfile }
    privileged: true
    hostname: node-as1
    volumes:
      - ./work/keys:/keys:ro
      - node-as1-docker:/var/lib/docker
      - node-as1-opt:/opt/homegap
    networks:
      e2e:
        ipv4_address: 172.30.0.11
        aliases: [node-as1.test.example.net]

  # A fresh VPS for the add-node wizard (root + password only). Not in the config until the wizard
  # adds it. Recreate it (`docker compose up -d --force-recreate node-fr1`) to test from scratch.
  node-fr1:
    build: { context: ., dockerfile: node-fresh.Dockerfile }
    privileged: true
    hostname: node-fr1
    volumes:
      - node-fr1-docker:/var/lib/docker
    networks:
      e2e:
        ipv4_address: 172.30.0.40
        aliases: [node-fr1.test.example.net]

  whoami:
    image: docker.io/traefik/whoami:v1.10
    networks: [e2e]

  homelab-traefik:
    image: docker.io/traefik:v3.7.16
    container_name: homelab-traefik
    command: ["--configFile=/etc/traefik/traefik.yml"]
    volumes:
      - ./homelab-traefik.yml:/etc/traefik/traefik.yml:ro
      - ./homelab-dynamic.yml:/etc/traefik/dynamic.yml:ro
      - ./work/homelab-certs:/certs:ro
    labels:
      homegap.expose: "test.example.net"
      homegap.wildcard: "true"
      homegap.protocol: "https"
      homegap.tls: "passthrough"
      homegap.proxy_protocol: "true"
      homegap.private_network: "e2e-private"
      homegap.private_hosts: "private"
      homegap.private_middleware: "private-only@file"
    networks: [e2e, e2e-private]

  # Dedicated subdomain, end-to-end TLS (SNI passthrough to the service itself).
  git:
    image: docker.io/traefik/whoami:v1.10
    command: ["--port", "8443", "--cert", "/certs/origin.pem", "--key", "/certs/origin.key", "--name", "git"]
    volumes: [ "./work/homelab-certs:/certs:ro" ]
    labels:
      homegap.expose: "git.test.example.net"
      homegap.protocol: "https"
      homegap.port: "8443"
    networks: [e2e]

  # Dedicated subdomain terminated on the node (plain http origin).
  wiki:
    image: docker.io/traefik/whoami:v1.10
    command: ["--name", "wiki"]
    labels:
      homegap.expose: "wiki.test.example.net"
      homegap.port: "80"
      homegap.healthcheck: "/health"
    networks: [e2e]

  # The front door of the extra domain: each name of other.example.org that has no service of
  # its own. The node ends TLS for it.
  other-door:
    image: docker.io/traefik/whoami:v1.10
    command: ["--name", "other-door"]
    labels:
      homegap.expose: "other.example.org"
      homegap.wildcard: "true"
      homegap.port: "80"
    networks: [e2e]

  # A dedicated service on the extra domain.
  shop:
    image: docker.io/traefik/whoami:v1.10
    command: ["--name", "shop"]
    labels:
      homegap.expose: "shop.other.example.org"
      homegap.port: "80"
    networks: [e2e]

  # A private service on the extra domain: only VPN devices reach it.
  notes:
    image: docker.io/traefik/whoami:v1.10
    command: ["--name", "notes"]
    labels:
      homegap.expose: "notes.other.example.org"
      homegap.port: "80"
      homegap.access: "private"
    networks: [e2e]

  # Raw TCP on its own public port.
  echo:
    image: docker.io/alpine/socat:1.8.0.1
    command: ["TCP-LISTEN:9000,fork,reuseaddr", "EXEC:cat"]
    labels:
      homegap.expose: "echo.test.example.net"
      homegap.protocol: "tcp"
      homegap.port: "9000"
      homegap.public_port: "19000"
    networks: [e2e]

  # Several raw ports on one container, like a voice/video server: a port list with protocols,
  # one port on both TCP and UDP, and a named service on the same hostname with a public port
  # that differs from the container's. The UDP echoes report the address they see, to show that
  # each caller keeps its own path through the mesh.
  rtc:
    image: docker.io/alpine/socat:1.8.0.1
    entrypoint: ["sh", "-c"]
    command:
      - |
        udp() { socat -T5 UDP-LISTEN:$$1,fork,reuseaddr SYSTEM:'read l; echo "$$l seen-from $$SOCAT_PEERADDR:$$SOCAT_PEERPORT"' & }
        socat TCP-LISTEN:7881,fork,reuseaddr EXEC:cat &
        socat TCP-LISTEN:3478,fork,reuseaddr EXEC:cat &
        udp 7882; udp 3478; udp 7000
        wait
    labels:
      homegap.expose: "rtc.test.example.net"
      homegap.port: "7881/tcp, 7882/udp, 3478/tcp+udp"
      homegap.services.alt.expose: "rtc.test.example.net"
      homegap.services.alt.port: "17000:7000/udp"
    networks: [e2e]

  # Private (VPN devices only): no public DNS or node port.
  ssh-jump:
    image: docker.io/alpine/socat:1.8.0.1
    command: ["TCP-LISTEN:22,fork,reuseaddr", "EXEC:echo SSH-2.0-fake"]
    labels:
      homegap.expose: "ssh.test.example.net"
      homegap.protocol: "tcp"
      homegap.port: "22"
      homegap.access: "private"
    networks: [e2e]

  # Raw TCP with PROXY protocol: the agent of a node serves the port and sends the header.
  proxy-echo:
    image: docker.io/library/python:3.12-alpine
    command: ["python", "-u", "/proxy-echo.py"]
    volumes: [ "./proxy-echo.py:/proxy-echo.py:ro" ]
    labels:
      homegap.expose: "proxy-echo.test.example.net"
      homegap.protocol: "tcp"
      homegap.port: "9100"
      homegap.public_port: "19100"
      homegap.proxy_protocol: "true"
    networks: [e2e]

  bunny-mock:
    image: docker.io/library/python:3.12-alpine
    command: ["python", "-u", "/mock.py"]
    volumes: [ "./bunny-mock.py:/mock.py:ro" ]
    networks: [e2e]

  # Holds the network namespace of the mesh (the mesh interface and the interface of the VPN
  # devices), as in deploy/compose.yml. The orchestrator is not in it.
  mesh:
    # A fixed image, never the HomeGAP one: recreating this container replaces the namespace
    # (and drops the mesh), so it must not change with HomeGAP updates. Everything sharing the
    # namespace restarts with it if it ever is recreated (depends_on restart: true).
    image: docker.io/library/busybox:1.37
    entrypoint: ["sh", "-c", "trap 'exit 0' TERM INT; while :; do sleep 3600 & wait; done"]
    sysctls:
      net.ipv4.ip_forward: "1"
    # The e2e network is where the fake nodes and the services are, so it is the way of this
    # namespace out to them. The private network is the one that
    # the front door serves VPN devices on (homegap.private_network).
    networks: [e2e, e2e-private]

  # The homelab's mesh agent, as in deploy/compose.yml.
  mesh-agent:
    image: homegap:e2e
    command: ["mesh"]
    restart: unless-stopped
    network_mode: service:mesh
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, NET_RAW, DAC_OVERRIDE]
    security_opt: ["no-new-privileges:true"]
    depends_on: { mesh: { condition: service_started, restart: true } }
    volumes: ["./work/mesh:/mesh", "./work/vpn:/vpn"]

  # The orchestrator reads Docker only through this proxy (container list and events).
  docker-proxy:
    image: docker.io/tecnativa/docker-socket-proxy:v0.5.0
    environment: { CONTAINERS: 1, EVENTS: 1, POST: 0 }
    volumes: ["/var/run/docker.sock:/var/run/docker.sock:ro"]
    networks: [e2e-docker]

  # A local ACME server in place of Let's Encrypt. It accepts each challenge without a DNS lookup,
  # so the harness checks that HomeGAP writes the challenge records, and not that they resolve.
  pebble:
    image: ghcr.io/letsencrypt/pebble:latest@sha256:0c81f05db371f436c97fb894bd6d2ab8fc9c8e2ce40f8bef8a8e15941bcd75ef
    environment:
      PEBBLE_VA_ALWAYS_VALID: "1"
      PEBBLE_VA_NOSLEEP: "1"
      PEBBLE_WFE_NONCEREJECT: "0"
    networks: [e2e]

  orchestrator:
    image: homegap:e2e
    command: ["run"]
    ports: [ "127.0.0.1:18088:8088", "127.0.0.1:18089:8089" ]
    networks:
      e2e: {}
      e2e-docker: {}
    # The same user and privileges as deploy/compose.yml, so the harness proves they are enough.
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      docker-proxy: { condition: service_started }
      pebble: { condition: service_started }
    environment:
      BUNNY_API_KEY: e2e-bunny-key
      # Lego reads these: the ACME server has a test certificate, and no nameserver has the
      # challenge records of the Bunny stand-in.
      LEGO_TLS_SKIP_VERIFY: "true"
      LEGO_DNS_PROPAGATION_WAIT: 1s
      DOCKER_HOST: tcp://docker-proxy:2375
    volumes:
      - ./config.e2e.yml:/config/config.yml
      - ./work/keys:/keys:ro
      - ./work/certs:/certs:ro
      - ./work/data:/data
      - ./work/mesh:/mesh
      - ./work/identity:/identity
      - ./work/sign-in:/sign-in:ro
      - ./work/vpn:/vpn:ro

  # The public sign-in of the homelab, as in deploy/compose.yml. It reads the signed directory of
  # users and has no key of the orchestrator.
  homegap-sign-in:
    image: homegap:e2e
    command: ["sign-in"]
    restart: unless-stopped
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    environment:
      HOMEGAP_OIDC_CLIENT_SECRET: e2e-oidc-client-secret
      # The provider of the harness has a certificate of the test CA.
      SSL_CERT_FILE: /certs/ca.pem
    volumes:
      - ./config.e2e.yml:/config/config.yml:ro
      - ./work/certs:/certs:ro
      - ./work/identity:/identity:ro
      - ./work/sign-in:/sign-in
      - ./work/vpn:/vpn
    networks: [e2e]

  # The OpenID Connect provider of the sign-in: a real Authelia, with its own TLS.
  authelia:
    image: docker.io/authelia/authelia:4.39
    restart: unless-stopped
    environment:
      X_AUTHELIA_CONFIG_FILTERS: template
    volumes:
      - ./authelia/configuration.yml:/config/configuration.yml:ro
      - ./work/authelia:/work:ro
      - ./work/certs:/certs:ro
    networks:
      e2e:
        aliases: [auth.test.example.net]

  viewer:
    image: docker.io/curlimages/curl:8.11.1
    entrypoint: ["sleep", "infinity"]
    volumes: [ "./work/certs:/certs:ro" ]
    networks: [e2e]

  # A device of the VPN: the unmodified client of the apps. CLIENT_NODE_IP stands in for the DNS
  # that sends the device to the nearest node. Start it with the credentials of a machine
  # (`homegap machine add`):
  #   OLM_ID=… OLM_SECRET=… CLIENT_NODE_IP=172.30.0.10 docker compose --profile client up -d client
  client:
    image: docker.io/fosrl/olm:1.10.1
    profiles: [client]
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun"]
    environment:
      PANGOLIN_ENDPOINT: https://signin.test.example.net
      OLM_ID: ${OLM_ID:-}
      OLM_SECRET: ${OLM_SECRET:-}
      SSL_CERT_FILE: /certs/trust.pem
      # The local API of the client, to read its state and to pick an exit.
      ENABLE_API: "true"
      HTTP_ADDR: 127.0.0.1:9452
    volumes: [ "./work/certs:/certs:ro" ]
    extra_hosts: ["signin.test.example.net:${CLIENT_NODE_IP:-172.30.0.11}"]
    networks: [e2e]

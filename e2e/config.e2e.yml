project: home-gap-e2e
domain: test.example.net
# A second domain for services, in its own zone of the DNS mock.
extra_domains:
  - domain: other.example.org
data_dir: /data
reconcile:
  resync_interval: 30s
  debounce: 2s
  node_check_interval: 2m
bunny:
  zone: example.net
  api_key_env: BUNNY_API_KEY
  api_url: http://bunny-mock:8080
# The local ACME server of the harness, in place of Let's Encrypt.
acme:
  email: ops@test.example.net
  directory: https://pebble:14000/dir
speedtest:
  enabled: true
  # VPN devices open the test page with no link from the dashboard.
  vpn_access: true
status_page:
  enabled: true
  title: HomeGAP e2e status
sign_in:
  url: https://signin.test.example.net
  oidc:
    name: Authelia
    issuer: https://auth.test.example.net:9091
    client_id: homegap
agent:
  # Built locally and loaded into the nodes by run.sh (load-images.sh).
  image: homegap:e2e
vpn:
  # Internet exits for the apps: one per node, and one at the homelab.
  exit_nodes:
    nodes: true
    homelab: true
    roles: [Member]

nodes:
  - id: na1
    region: NA
    provider: e2e
    host: 172.30.0.10
    os: ubuntu-24.04
    ssh_user: deploy
    ssh_key_file: /keys/id_ed25519
    location: { latitude: 45.5, longitude: -73.6 }
  - id: as1
    region: AS
    provider: e2e
    host: 172.30.0.11
    os: ubuntu-24.04
    ssh_user: deploy
    ssh_key_file: /keys/id_ed25519
    location: { latitude: 19.1, longitude: 72.9 }
dashboard:
  bind: 0.0.0.0:8088
  # The homelab Traefik serves the dashboard at orc.test.example.net, for VPN devices only.
  hostname: orc
  access: private
  # Sign-in through a middleware of the homelab Traefik (sign-in@file stands in for Authelia).
  sso:
    middleware: sign-in@file
    groups: [admins]
    read_only_groups: [family]

# Where the homelab is, for the maps (the status page shows only its region).
homelab:
  location: { latitude: 32.78, longitude: -96.8, name: "Dallas, Texas" }
  # SSH to the homelab host for VPN devices. The harness host has no SSH server: the check is
  # that HomeGAP makes the private service with the address that the mesh agent found.
  ssh:
    enabled: true
    hostname: hostssh

project: home-gap-e2e
domain: test.example.net
# A second domain for services, in its own zone of the DNS mock.
extra_domains:
  - domain: other.example.org
data_dir: /data
reconcile:
  resync_interval: 30s
  debounce: 2s
  node_check_interval: 2m
bunny:
  zone: example.net
  api_key_env: BUNNY_API_KEY
  api_url: http://bunny-mock:8080
pangolin:
  acme_email: ops@test.example.net
  license_key_env: PANGOLIN_LICENSE_KEY
# The local ACME server of the harness, in place of Let's Encrypt.
acme:
  directory: https://pebble:14000/dir
tunnels:
  mtu: 1420
  native: true
speedtest:
  enabled: true
status_page:
  enabled: true
  title: HomeGAP e2e status
# The cluster mesh between the homelab (the orchestrator) and every node.
cluster:
  mesh: {}
  # Built locally and loaded into the nodes by run.sh (load-cluster-image.sh).
  image: homegap-cluster:e2e
  primary:
    switch_back_after: 1m
  # Internet exits for the Pangolin apps: one per node, and one at the homelab.
  exit_nodes:
    nodes: true
    homelab: true
    roles: [Member]

nodes:
  - id: na1
    region: NA
    provider: e2e
    host: 172.30.0.10
    os: ubuntu-24.04
    ssh_user: deploy
    ssh_key_file: /keys/id_ed25519
    location: { latitude: 45.5, longitude: -73.6 }
  - id: as1
    region: AS
    provider: e2e
    host: 172.30.0.11
    os: ubuntu-24.04
    ssh_user: deploy
    ssh_key_file: /keys/id_ed25519
    location: { latitude: 19.1, longitude: 72.9 }
dashboard:
  bind: 0.0.0.0:8088

# Where the homelab is, for the maps (the status page shows only its region).
homelab:
  location: { latitude: 32.78, longitude: -96.8, name: "Dallas, Texas" }

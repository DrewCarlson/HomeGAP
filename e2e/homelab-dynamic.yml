tls:
  stores:
    default:
      defaultCertificate:
        certFile: /certs/origin.pem
        keyFile: /certs/origin.key
http:
  routers:
    # Speed test and status page hostnames go to the orchestrator's public origin.
    homegap-speedtest:
      rule: "Host(`speedtest.test.example.net`) || HostRegexp(`^(speedtest|status)-[a-z0-9-]+\\.test\\.example\\.net$`)"
      entryPoints: [websecure]
      service: homegap-speedtest
      priority: 1000
      tls: {}
    # Pangolin clients only: their traffic arrives over the private network.
    private-only:
      rule: "Host(`private.test.example.net`)"
      entryPoints: [websecure]
      service: whoami
      middlewares: [private-only]
      tls: {}
    # A private-only service in a subfolder of the root, found through the API.
    grafana:
      rule: "Host(`test.example.net`) && PathPrefix(`/grafana`)"
      entryPoints: [websecure]
      service: whoami
      middlewares: [private-only]
      tls: {}
    everything:
      rule: "HostRegexp(`.+`)"
      entryPoints: [websecure]
      service: whoami
      tls: {}
  middlewares:
    private-only:
      ipAllowList:
        sourceRange: ["172.29.0.0/24"]
  services:
    homegap-speedtest:
      loadBalancer:
        servers:
          - url: "http://orchestrator:8089"
    whoami:
      loadBalancer:
        servers:
          - url: "http://whoami:80"

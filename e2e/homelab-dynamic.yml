tls:
  stores:
    default:
      defaultCertificate:
        certFile: /certs/origin.pem
        keyFile: /certs/origin.key
http:
  routers:
    # The speed test and status page names have no route here: the orchestrator gives Traefik
    # that route through the HTTP provider (see homelab-traefik.yml).
    # Pangolin clients only: their traffic arrives over the private network.
    private-only:
      rule: "Host(`private.test.example.net`)"
      entryPoints: [websecure]
      service: whoami
      middlewares: [private-only]
      tls: {}
    # A private-only service in a subfolder of the root, found through the API.
    grafana:
      rule: "Host(`test.example.net`) && PathPrefix(`/grafana`)"
      entryPoints: [websecure]
      service: whoami
      middlewares: [private-only]
      tls: {}
    everything:
      rule: "HostRegexp(`.+`)"
      entryPoints: [websecure]
      service: whoami
      tls: {}
  middlewares:
    private-only:
      ipAllowList:
        sourceRange: ["172.29.0.0/24"]
  services:
    whoami:
      loadBalancer:
        servers:
          - url: "http://whoami:80"

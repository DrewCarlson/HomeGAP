tls:
  stores:
    default:
      defaultCertificate:
        certFile: /certs/origin.pem
        keyFile: /certs/origin.key
http:
  routers:
    # Speed test and status page hostnames go to the orchestrator's public origin.
    homegap-speedtest:
      rule: "Host(`speedtest.test.example.net`) || HostRegexp(`^(speedtest|status)-[a-z0-9-]+\\.test\\.example\\.net$`)"
      entryPoints: [websecure]
      service: homegap-speedtest
      priority: 1000
      tls: {}
    everything:
      rule: "HostRegexp(`.+`)"
      entryPoints: [websecure]
      service: whoami
      tls: {}
  services:
    homegap-speedtest:
      loadBalancer:
        servers:
          - url: "http://orchestrator:8089"
    whoami:
      loadBalancer:
        servers:
          - url: "http://whoami:80"

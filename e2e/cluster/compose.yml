# Prototype: Pangolin EE clustering across two HomeGAP nodes with a dynamic database primary.
# Three mesh members (homelab hl, nodes c1 and c2), each one network namespace (its "host"
# container, like a real host) reachable from the others only through the WireGuard mesh.
# Every member runs etcd (the vote), Patroni-managed PostgreSQL, and Valkey with Sentinel; the
# primary lives on the homelab by default and moves to a node while the homelab is down. Each node
# also runs HAProxy (stable local addresses for the current primaries), Pangolin, Gerbil and
# Traefik. The homelab's Traefik (origin certificate) and connectors stand in for the homelab stack.
# Test-only credentials. Run ./setup.sh first.
name: homegap-cluster

x-host: &host
  image: docker.io/library/alpine:3.20
  command: ["/bin/sh", "/host-init.sh"]
  cap_add: [NET_ADMIN, SYS_MODULE]
  healthcheck:
    test: ["CMD", "ip", "link", "show", "mesh0"]
    interval: 2s
    retries: 60

x-etcd: &etcd
  image: gcr.io/etcd-development/etcd:v3.5.17
  command: ["/usr/local/bin/etcd"]
  environment:
    ETCD_INITIAL_CLUSTER: hl=http://10.77.0.10:2380,c1=http://10.77.0.1:2380,c2=http://10.77.0.2:2380
    ETCD_INITIAL_CLUSTER_STATE: new
    ETCD_INITIAL_CLUSTER_TOKEN: homegap-e2e
    ETCD_DATA_DIR: /etcd-data

x-db: &db
  build: { context: ., dockerfile: patroni.Dockerfile }
  image: homegap-e2e-patroni:17
  healthcheck:
    test: ["CMD", "pg_isready", "-h", "127.0.0.1"]
    interval: 3s
    retries: 100

x-valkey: &valkey
  image: docker.io/valkey/valkey:8.1

x-pangolin: &pangolin
  image: docker.io/fosrl/pangolin:ee-postgresql-1.26.0
  environment:
    PANGOLIN_SETUP_TOKEN: ${SETUP_TOKEN:-}
  healthcheck:
    test: ["CMD", "curl", "-f", "http://localhost:3001/api/v1/"]
    interval: 5s
    timeout: 5s
    retries: 40

x-traefik: &traefik
  image: docker.io/traefik:v3.7.16
  command: ["--configFile=/etc/traefik/traefik_config.yml"]

services:
  # ------------------------------------------------------------------ homelab member
  hl-host:
    <<: *host
    volumes: ["./host-init.sh:/host-init.sh:ro", "./work/hl:/node:ro"]
    networks: { cl: { ipv4_address: 172.31.0.30 } }
  hl-etcd:
    <<: *etcd
    network_mode: service:hl-host
    environment:
      ETCD_NAME: hl
      ETCD_INITIAL_CLUSTER: hl=http://10.77.0.10:2380,c1=http://10.77.0.1:2380,c2=http://10.77.0.2:2380
      ETCD_INITIAL_CLUSTER_STATE: new
      ETCD_INITIAL_CLUSTER_TOKEN: homegap-e2e
      ETCD_DATA_DIR: /etcd-data
      ETCD_LISTEN_PEER_URLS: http://10.77.0.10:2380
      ETCD_LISTEN_CLIENT_URLS: http://10.77.0.10:2379,http://127.0.0.1:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://10.77.0.10:2379
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://10.77.0.10:2380
    depends_on: { hl-host: { condition: service_healthy } }
  hl-db:
    <<: *db
    network_mode: service:hl-host
    volumes: ["./work/hl:/node:ro"]
    depends_on: { hl-etcd: { condition: service_started } }
  hl-valkey:
    <<: *valkey
    network_mode: service:hl-host
    command: ["valkey-server", "--protected-mode", "no", "--replica-announce-ip", "10.77.0.10", "--replica-priority", "1"]
    depends_on: { hl-host: { condition: service_healthy } }
  hl-sentinel:
    <<: *valkey
    network_mode: service:hl-host
    command: ["sh", "-c", "cp /node/sentinel.conf /tmp/sentinel.conf && exec valkey-server /tmp/sentinel.conf --sentinel"]
    volumes: ["./work/hl:/node:ro"]
    depends_on: { hl-valkey: { condition: service_started } }

  # ------------------------------------------------------------------ node c1
  c1-host:
    <<: *host
    volumes: ["./host-init.sh:/host-init.sh:ro", "./work/c1:/node:ro"]
    ports: ["127.0.0.1:18101:3080"]
    networks: { cl: { ipv4_address: 172.31.0.11 } }
  c1-etcd:
    <<: *etcd
    network_mode: service:c1-host
    environment:
      ETCD_NAME: c1
      ETCD_INITIAL_CLUSTER: hl=http://10.77.0.10:2380,c1=http://10.77.0.1:2380,c2=http://10.77.0.2:2380
      ETCD_INITIAL_CLUSTER_STATE: new
      ETCD_INITIAL_CLUSTER_TOKEN: homegap-e2e
      ETCD_DATA_DIR: /etcd-data
      ETCD_LISTEN_PEER_URLS: http://10.77.0.1:2380
      ETCD_LISTEN_CLIENT_URLS: http://10.77.0.1:2379,http://127.0.0.1:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://10.77.0.1:2379
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://10.77.0.1:2380
    depends_on: { c1-host: { condition: service_healthy } }
  c1-db:
    <<: *db
    network_mode: service:c1-host
    volumes: ["./work/c1:/node:ro"]
    depends_on: { c1-etcd: { condition: service_started } }
  c1-valkey:
    <<: *valkey
    network_mode: service:c1-host
    command: ["valkey-server", "--protected-mode", "no", "--replicaof", "10.77.0.10", "6379", "--replica-announce-ip", "10.77.0.1", "--replica-priority", "100"]
    depends_on: { c1-host: { condition: service_healthy } }
  c1-sentinel:
    <<: *valkey
    network_mode: service:c1-host
    command: ["sh", "-c", "cp /node/sentinel.conf /tmp/sentinel.conf && exec valkey-server /tmp/sentinel.conf --sentinel"]
    volumes: ["./work/c1:/node:ro"]
    depends_on: { c1-valkey: { condition: service_started } }
  c1-haproxy:
    image: docker.io/library/haproxy:3.0-alpine
    network_mode: service:c1-host
    volumes: ["./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro"]
    depends_on: { c1-host: { condition: service_healthy } }
  c1-pangolin:
    <<: *pangolin
    network_mode: service:c1-host
    volumes:
      - ./work/c1/config:/app/config
      - ./work/c1/config/certificates:/var/certificates
      - ./work/c1/config/dynamic:/var/dynamic
    depends_on: { c1-haproxy: { condition: service_started } }
  c1-gerbil:
    image: docker.io/fosrl/gerbil:1.6.0
    network_mode: service:c1-host
    cap_add: [NET_ADMIN, SYS_MODULE]
    command:
      - --reachableAt=http://10.77.0.1:3004
      - --generateAndSaveKeyTo=/var/config/key
      - --remoteConfig=http://127.0.0.1:3001/api/v1/
    volumes: [./work/c1/config:/var/config]
    depends_on: { c1-pangolin: { condition: service_healthy } }
  c1-traefik:
    <<: *traefik
    network_mode: service:c1-host
    depends_on: { c1-pangolin: { condition: service_healthy } }
    volumes:
      - ./work/c1/config/traefik:/etc/traefik:ro
      - ./work/c1/config/certificates:/var/certificates
      - ./work/c1/config/dynamic:/var/dynamic:ro
      - ./work/c1/certs:/certs:ro

  # ------------------------------------------------------------------ node c2
  c2-host:
    <<: *host
    volumes: ["./host-init.sh:/host-init.sh:ro", "./work/c2:/node:ro"]
    ports: ["127.0.0.1:18102:3080"]
    networks: { cl: { ipv4_address: 172.31.0.21 } }
  c2-etcd:
    <<: *etcd
    network_mode: service:c2-host
    environment:
      ETCD_NAME: c2
      ETCD_INITIAL_CLUSTER: hl=http://10.77.0.10:2380,c1=http://10.77.0.1:2380,c2=http://10.77.0.2:2380
      ETCD_INITIAL_CLUSTER_STATE: new
      ETCD_INITIAL_CLUSTER_TOKEN: homegap-e2e
      ETCD_DATA_DIR: /etcd-data
      ETCD_LISTEN_PEER_URLS: http://10.77.0.2:2380
      ETCD_LISTEN_CLIENT_URLS: http://10.77.0.2:2379,http://127.0.0.1:2379
      ETCD_ADVERTISE_CLIENT_URLS: http://10.77.0.2:2379
      ETCD_INITIAL_ADVERTISE_PEER_URLS: http://10.77.0.2:2380
    depends_on: { c2-host: { condition: service_healthy } }
  c2-db:
    <<: *db
    network_mode: service:c2-host
    volumes: ["./work/c2:/node:ro"]
    depends_on: { c2-etcd: { condition: service_started } }
  c2-valkey:
    <<: *valkey
    network_mode: service:c2-host
    command: ["valkey-server", "--protected-mode", "no", "--replicaof", "10.77.0.10", "6379", "--replica-announce-ip", "10.77.0.2", "--replica-priority", "100"]
    depends_on: { c2-host: { condition: service_healthy } }
  c2-sentinel:
    <<: *valkey
    network_mode: service:c2-host
    command: ["sh", "-c", "cp /node/sentinel.conf /tmp/sentinel.conf && exec valkey-server /tmp/sentinel.conf --sentinel"]
    volumes: ["./work/c2:/node:ro"]
    depends_on: { c2-valkey: { condition: service_started } }
  c2-haproxy:
    image: docker.io/library/haproxy:3.0-alpine
    network_mode: service:c2-host
    volumes: ["./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro"]
    depends_on: { c2-host: { condition: service_healthy } }
  c2-pangolin:
    <<: *pangolin
    network_mode: service:c2-host
    volumes:
      - ./work/c2/config:/app/config
      - ./work/c2/config/certificates:/var/certificates
      - ./work/c2/config/dynamic:/var/dynamic
    depends_on: { c2-haproxy: { condition: service_started } }
  c2-gerbil:
    image: docker.io/fosrl/gerbil:1.6.0
    network_mode: service:c2-host
    cap_add: [NET_ADMIN, SYS_MODULE]
    command:
      - --reachableAt=http://10.77.0.2:3004
      - --generateAndSaveKeyTo=/var/config/key
      - --remoteConfig=http://127.0.0.1:3001/api/v1/
    volumes: [./work/c2/config:/var/config]
    depends_on: { c2-pangolin: { condition: service_healthy } }
  c2-traefik:
    <<: *traefik
    network_mode: service:c2-host
    depends_on: { c2-pangolin: { condition: service_healthy } }
    volumes:
      - ./work/c2/config/traefik:/etc/traefik:ro
      - ./work/c2/config/certificates:/var/certificates
      - ./work/c2/config/dynamic:/var/dynamic:ro
      - ./work/c2/certs:/certs:ro

  # ------------------------------------------------------------------ homelab services
  whoami:
    image: docker.io/traefik/whoami:v1.10
    networks: { home: {} }
  homelab-traefik:
    image: docker.io/traefik:v3.7.16
    command: ["--configFile=/etc/traefik/traefik.yml"]
    volumes:
      - ../homelab-traefik.yml:/etc/traefik/traefik.yml:ro
      - ../homelab-dynamic.yml:/etc/traefik/dynamic.yml:ro
      - ../work/homelab-certs:/certs:ro
    networks: { home: {} }
  # One connector per node, each connecting through its own node (pinned by region).
  newt-c1:
    image: docker.io/fosrl/newt:1.20.0
    profiles: [sites]
    environment:
      PANGOLIN_ENDPOINT: http://pangolin-c1.test.example.net:3080
      NEWT_ID: ${NEWT_C1_ID:-}
      NEWT_SECRET: ${NEWT_C1_SECRET:-}
    extra_hosts: ["pangolin-c1.test.example.net:172.31.0.11"]
    networks: { home: {}, cl: { ipv4_address: 172.31.0.32 } }
  newt-c2:
    image: docker.io/fosrl/newt:1.20.0
    profiles: [sites]
    environment:
      PANGOLIN_ENDPOINT: http://pangolin-c2.test.example.net:3080
      NEWT_ID: ${NEWT_C2_ID:-}
      NEWT_SECRET: ${NEWT_C2_SECRET:-}
    extra_hosts: ["pangolin-c2.test.example.net:172.31.0.21"]
    networks: { home: {}, cl: { ipv4_address: 172.31.0.33 } }

  # A roaming client; CLIENT_NODE_IP picks which node "nearest" DNS sends it to.
  client:
    image: docker.io/fosrl/olm:1.10.1
    profiles: [client]
    cap_add: [NET_ADMIN]
    devices: ["/dev/net/tun"]
    environment:
      PANGOLIN_ENDPOINT: http://pangolin.test.example.net:3080
      OLM_ID: ${OLM_ID:-}
      OLM_SECRET: ${OLM_SECRET:-}
    extra_hosts: ["pangolin.test.example.net:${CLIENT_NODE_IP:-172.31.0.11}"]
    networks: { cl: { ipv4_address: 172.31.0.41 } }

networks:
  cl:
    ipam: { config: [{ subnet: 172.31.0.0/24 }] }
  home: {}

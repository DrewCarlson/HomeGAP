# On every node: stable local addresses for "whoever is primary right now", so Pangolin's
# connection settings never change across failovers. PostgreSQL follows Patroni's /primary check;
# Valkey follows whichever member reports role:master. Connections to a demoted member are cut.
global
  maxconn 2000

defaults
  mode tcp
  timeout connect 5s
  timeout client 30m
  timeout server 30m
  timeout check 5s
  default-server inter 4s fastinter 1s fall 3 rise 2 on-marked-down shutdown-sessions

listen pg-primary
  bind 127.0.0.1:5433
  option httpchk OPTIONS /primary
  http-check expect status 200
  server hl 10.77.0.10:5432 check port 8008
  server c1 10.77.0.1:5432 check port 8008
  server c2 10.77.0.2:5432 check port 8008

listen valkey-primary
  bind 127.0.0.1:6380
  option tcp-check
  tcp-check send PING\r\n
  tcp-check expect string +PONG
  tcp-check send info\ replication\r\n
  tcp-check expect string role:master
  tcp-check send QUIT\r\n
  tcp-check expect string +OK
  server hl 10.77.0.10:6379 check
  server c1 10.77.0.1:6379 check
  server c2 10.77.0.2:6379 check

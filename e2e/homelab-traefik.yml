entryPoints:
  websecure:
    address: ":443"
    # The nodes send each viewer's address with PROXY protocol (homegap.proxy_protocol).
    proxyProtocol:
      trustedIPs: ["172.30.0.0/24"]
    # Entry point defaults, as most homelab setups have: Traefik then copies a route without
    # entry points into one per entry point, renamed (see HomelabTraefik.isOwn).
    http:
      tls: {}
  web:
    address: ":80"
    forwardedHeaders:
      trustedIPs: ["172.30.0.0/24"]
# HomeGAP reads the routers that use the private-only middleware (homegap.private_middleware)
# from the API, at http://homelab-traefik:8080.
api:
  insecure: true
providers:
  file:
    filename: /etc/traefik/dynamic.yml
  # Names only the nodes serve answer 421 here, so a browser reusing a connection reconnects
  # (see docs/services/traffic-paths.md). No token: the orchestrator recognizes this Traefik.
  http:
    endpoint: http://orchestrator:8088/api/traefik/homelab
    pollInterval: 10s

[versions]
kotlin = "2.4.20"
ktor = "3.6.1"
kotlinx-serialization = "1.12.0"
kotlinx-coroutines = "1.11.0"
kotlinx-io = "0.9.2"
kotlin-logging = "8.0.6"
kaml = "0.104.0"
compose = "1.12.2"
kotlin-vite = "0.1.0"
ksubprocess = "1.0.0-beta01"
# The self-hosted map (web/build.gradle.kts): pinned, at least two weeks old when updated.
maplibre = "6.16.0"
pmtiles = "4.5.0"
protomaps-basemaps = "5.7.2"
metro = "1.5.2"
molecule = "2.2.0"

[libraries]
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-client-curl = { module = "io.ktor:ktor-client-curl", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-cio = { module = "io.ktor:ktor-server-cio", version.ref = "ktor" }
ktor-server-content-negotiation = { module = "io.ktor:ktor-server-content-negotiation", version.ref = "ktor" }
ktor-server-auth = { module = "io.ktor:ktor-server-auth", version.ref = "ktor" }
ktor-server-status-pages = { module = "io.ktor:ktor-server-status-pages", version.ref = "ktor" }
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinx-serialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinx-coroutines" }
kotlinx-io-core = { module = "org.jetbrains.kotlinx:kotlinx-io-core", version.ref = "kotlinx-io" }
kotlin-logging = { module = "io.github.oshai:kotlin-logging", version.ref = "kotlin-logging" }
kaml = { module = "com.charleskorn.kaml:kaml", version.ref = "kaml" }
molecule-runtime = { module = "app.cash.molecule:molecule-runtime", version.ref = "molecule" }
ksubprocess = { module = "org.drewcarlson:ksubprocess", version.ref = "ksubprocess" }

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose = { id = "org.jetbrains.compose", version.ref = "compose" }
kotlin-vite = { id = "org.drewcarlson.kotlin-vite", version.ref = "kotlin-vite" }
metro = { id = "dev.zacsweers.metro", version.ref = "metro" }
